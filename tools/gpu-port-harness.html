<!doctype html>
<meta charset="utf-8">
<title>GPU port harness</title>
<!--
  ONE FUNCTION AT A TIME, EACH PROVEN BEFORE THE NEXT.
.
  The per-pixel path is 282 lines of code across seventeen functions - glassUnwarp three times a
  pixel, glassFlow, glassFormT, glassLay, glassMelt, the op chain, and the leaves under them. Writing
  all of that as one shader and then asking why a tile does not match is the way this goes wrong: a
  tile is 270,400 pixels of wrong answer with no way to say which line did it.
.
  So this is the instrument the port is built on. It takes the app's own JS function and a WGSL
  function meant to be the same thing, runs both over the same inputs, and reports how far apart they
  land. Nothing gets added to the shader until its row here is green.
.
  WHAT COUNTS AS GREEN DIFFERS BY FUNCTION, and saying so per row is the point.
.
    EXACT    integer work - nz is multiply, xor and shift, and WGSL wraps u32 as Math.imul does, so
             anything but bit-identical means the port is wrong, not imprecise.
    f32      JS computes in doubles and a shader in f32. A pure-arithmetic port cannot be bit-exact
             and should land within a few ulps of f32 - about 1e-7 relative. A row that is merely
             CLOSE, say 1e-4, is a port with a mistake in it that happens to be small.
    branch   a function that selects rather than computes - glassFlow picks a vector per form - has
             to agree EXACTLY, because there is nothing to round. A near miss means a branch differs.
.
  THE CPU SIDE IS LIFTED, NEVER RETYPED, for the reason every probe here says: a second copy drifts
  the first time somebody edits one. The WGSL side is written here for now and MOVES INTO THE APP
  WHOLESALE once the port is proven - keeping it here while it churns avoids two copies of code that
  is still changing, and the moment the app has a copy too, it is the only copy.
.
  STRUCTURE DATA IS SYNTHETIC AND SHARED. glassUnwarp reads a warp grid; rather than building a real
  one through glassWarp, both sides get the SAME deterministic grid. That tests the interpolation,
  which is the part being ported, without dragging in the setup that builds it.
-->

<h1>GPU port harness</h1>
<p class="sub">Each function of the per-pixel path, the app’s own JS against the WGSL meant to replace
it, over the same inputs. Nothing joins the shader until its row is green — and what green means is
stated per row, because an integer port and a float port fail differently.</p>
<button id="run">Run</button>
<div id="res"></div>
<pre id="log"></pre>

<script>
const RES = document.getElementById('res'), LOG = document.getElementById('log');
const log = m => { LOG.textContent += (LOG.textContent ? '\n' : '') + m; };
let TB = null;
function table(cols) {
  TB = document.createElement('table');
  const tr = document.createElement('tr');
  for (const c of cols) { const th = document.createElement('th'); th.textContent = c; tr.appendChild(th); }
  TB.appendChild(tr); RES.appendChild(TB);
}
function row(cells, cls) {
  const tr = document.createElement('tr');
  cells.forEach((c, i) => { const td = document.createElement('td'); td.textContent = c;
    if (i >= 2 && i <= 3) td.className = 'n'; tr.appendChild(td); });
  if (cls) tr.children[0].className = cls;
  TB.appendChild(tr);
}

// ---- the app's own functions ---------------------------------------------------------------------
const APP_PATHS = ['../app/stone-author.html', 'app/stone-author.html', './stone-author.html'];
async function liftFromApp(names) {
  let src = null, from = null;
  for (const u of APP_PATHS) {
    try { const r = await fetch(u); if (r.ok) { src = await r.text(); from = u; break; } } catch (e) {}
  }
  if (src === null) throw new Error('could not find the app');
  const fn = name => {
    const i = src.indexOf('function ' + name + '(');
    if (i < 0) throw new Error('the app has no function ' + name);
    let d = 0;
    for (let k = src.indexOf('{', i); k < src.length; k++) {
      if (src[k] === '{') d++;
      else if (src[k] === '}') { d--; if (!d) return src.slice(i, k + 1); }
    }
    throw new Error('unbalanced ' + name);
  };
  const decl = (src.match(/const _NZC = new Float64Array\([^;]*\);/) || [])[0] || '';
  return { app: new Function(decl + '\n' + names.map(fn).join('\n') + '\nreturn {' + names.join(',') + '};')(), from };
}

// ---- THE SHADER LIBRARY, growing one proven function at a time -------------------------------------
// Each entry is the WGSL for one function plus whatever it needs. They are concatenated in order, so
// a function may use anything declared above it.
const NLC = String.fromCharCode(10);
const WGSL = {};

WGSL.env = `
struct Env {
  // the melt and the form
  TH: f32, RM: f32, RS: f32, FR: f32,
  FP: f32, FD: f32, SD: f32, INC: f32,
  SST: f32, MOB: f32, MST: f32, MW: f32,
  MSQ: f32, MJ: f32, CN: f32, TW: f32,
  LC: f32, LS: f32, CW: f32, CS: f32,
  LP: f32, STC: f32, WPH: f32, RLH: f32,
  RLtotal: f32, pad0: f32, pad1: f32, pad2: f32,
  // the integers
  form: i32, MR: i32, MB: i32, MCn: i32,
  STn: i32, WPnx: i32, WPny: i32, RLnx: i32,
  RLny: i32, RLn: i32, pad3: i32, pad4: i32,
  oWU: i32, oWV: i32, oMEX: i32, oMHL: i32,
  oMD: i32, oMRIM: i32, oBS: i32, oBV: i32,
  oRPR: i32, oRTL: i32, oSTS: i32, oMCC: i32,
};
@group(0) @binding(2) var<uniform> E: Env;
@group(0) @binding(3) var<storage, read> ARR: array<f32>;
fn aWU(k: i32) -> f32 { return ARR[E.oWU + k]; }
fn aWV(k: i32) -> f32 { return ARR[E.oWV + k]; }
fn aMEX(k: i32) -> f32 { return ARR[E.oMEX + k]; }
fn aMHL(k: i32) -> f32 { return ARR[E.oMHL + k]; }
fn aMD(k: i32) -> f32 { return ARR[E.oMD + k]; }
fn aMRIM(k: i32) -> f32 { return ARR[E.oMRIM + k]; }
fn aBS(k: i32) -> f32 { return ARR[E.oBS + k]; }
fn aBV(k: i32) -> f32 { return ARR[E.oBV + k]; }
fn aRPR(k: i32) -> f32 { return ARR[E.oRPR + k]; }
fn aRTL(k: i32) -> f32 { return ARR[E.oRTL + k]; }
fn aSTS(k: i32) -> vec4<f32> { let o = E.oSTS + k * 4; return vec4<f32>(ARR[o], ARR[o + 1], ARR[o + 2], ARR[o + 3]); }
fn aMCC(k: i32) -> f32 { return ARR[E.oMCC + k]; }
const PINF: f32 = 1e30;`;


WGSL.nz = `
fn nz(xi: i32, yi: i32, s: i32) -> f32 {
  var h: u32 = (u32(xi) * 374761393u) ^ (u32(yi) * 668265263u) ^ (u32(s) * 2246822519u);
  h = (h ^ (h >> 13u)) * 1274126177u;
  return f32(h ^ (h >> 16u)) / 4294967296.0;
}`;

// THE SAME RATIONAL, TERM FOR TERM. Not a better atan2 - a port. The app ships this approximation and
// the GPU path has to draw what the CPU path draws, so an IMPROVEMENT here would be a defect.
WGSL.woodAtan2 = `
fn woodAtan2(y: f32, x: f32) -> f32 {
  let ax = select(x, -x, x < 0.0); let ay = select(y, -y, y < 0.0);
  let mn = min(ax, ay); let mx = max(ax, ay);
  let a = mn / (mx + 1e-12);
  var r = a * (0.7853981634 - (a - 1.0) * (0.2447 + 0.0663 * a));
  if (ay > ax) { r = 1.5707963268 - r; }
  if (x < 0.0) { r = 3.1415926536 - r; }
  return select(r, -r, y < 0.0);
}`;

// A SELECTOR, NOT A COMPUTATION. form is an integer here because WGSL has no strings; the mapping is
// fixed in FORM below and both sides read it from the same place.
WGSL.glassFlow = `
fn glassFlow(ox: f32, oy: f32, form: i32) -> vec2<f32> {
  if (form == 1) {                                   // spun: radial, and it VARIES with position
    var r = sqrt(ox * ox + oy * oy);
    if (r == 0.0) { r = 1e-6; }
    return vec2<f32>(ox / r, oy / r);
  }
  if (form == 2) { return vec2<f32>(0.0, 0.0); }     // poured
  if (form == 3) { return vec2<f32>(0.0, 1.0); }     // blown
  return vec2<f32>(1.0, 0.0);                        // rolled and flattened run across the sheet
}`;

// A BILINEAR READ OF A GRID, and the first function here that needs a buffer. The app writes
// `fx | 0`, which truncates toward zero; i32() does the same, and cu is bounded to [0,1] so the two
// cannot part company on a negative.
WGSL.glassUnwarp = `
fn glassUnwarp(cu: f32, cvv: f32) -> vec2<f32> {
  let fx = cu * f32(E.WPnx - 1); let fy = (cvv / E.WPH) * f32(E.WPny - 1);
  var i0 = i32(fx); var j0 = i32(fy);
  if (i0 > E.WPnx - 2) { i0 = E.WPnx - 2; } if (i0 < 0) { i0 = 0; }
  if (j0 > E.WPny - 2) { j0 = E.WPny - 2; } if (j0 < 0) { j0 = 0; }
  let tx = fx - f32(i0); let ty = fy - f32(j0);
  let k = j0 * E.WPnx + i0; let k2 = k + E.WPnx;
  let u = -((aWU(k) * (1.0 - tx) + aWU(k + 1) * tx) * (1.0 - ty) + (aWU(k2) * (1.0 - tx) + aWU(k2 + 1) * tx) * ty);
  let v = -((aWV(k) * (1.0 - tx) + aWV(k + 1) * tx) * (1.0 - ty) + (aWV(k2) * (1.0 - tx) + aWV(k2 + 1) * tx) * ty);
  return vec2<f32>(u, v);
}`;


// UNCACHED ON PURPOSE. vnoiseC is a per-thread last-cell cache and a GPU invocation has no previous
// sample to cache from, so what gets ported is vnoise. The cache never changes the ANSWER - it only
// skips recomputing it - so the value this has to match is the CPU's cached fbm2C all the same.
WGSL.vnoise = `
fn vnoise(x: f32, y: f32, s: i32) -> f32 {
  let fx = floor(x); let fy = floor(y);
  let xi = i32(fx); let yi = i32(fy);
  let tx = x - fx; let ty = y - fy;
  let sx = tx * tx * (3.0 - 2.0 * tx); let sy = ty * ty * (3.0 - 2.0 * ty);
  let a = nz(xi, yi, s); let b = nz(xi + 1, yi, s);
  let c = nz(xi, yi + 1, s); let d = nz(xi + 1, yi + 1, s);
  return (a * (1.0 - sx) + b * sx) * (1.0 - sy) + (c * (1.0 - sx) + d * sx) * sy;
}`;

WGSL.fbm2 = `
fn fbm2(x: f32, y: f32, s: i32) -> f32 {
  return vnoise(x, y, s) * 0.6 + vnoise(x * 2.1, y * 2.1, s + 9) * 0.3
       + vnoise(x * 4.3, y * 4.3, s + 19) * 0.1;
}`;

// THE RIBBON GEOMETRY. MEX, MHL, MD and MRIM are per-ribbon arrays; MOB and MST are scalars. The
// app writes its own min/max and abs out longhand as ternaries - select() and min()/max() are the
// same operations, not an improvement, and anything else would be a second implementation.
WGSL.ribbon = `
fn glassCellSDF(gc: f32, ga: f32, i: i32) -> f32 {
  let cx = (aMEX(i) + aMEX(i + 1)) * 0.5;
  let hw = (aMEX(i + 1) - aMEX(i)) * 0.5;
  let hh = aMHL(i);
  let r = min(hw, hh) * E.MOB;
  let ax = abs(gc - cx) - (hw - r);
  let ay = abs(ga) - (hh - r);
  let qx = max(ax, 0.0); let qy = max(ay, 0.0);
  let inner = max(ax, ay);
  return sqrt(qx * qx + qy * qy) + min(inner, 0.0) - r;
}
fn glassDepth(d: f32, i: i32) -> f32 {
  let lim = aMD(i); let rim = aMRIM(i);
  if (d <= -rim) { return 1.0; }
  var far = 1.0;
  if (d <= 0.0) { far = 0.0; } else if (lim > 0.0) { far = d / lim; }
  var edge = 1.0;
  if (d <= 0.0) { if (rim > 0.0) { edge = -d / rim; } else { edge = 1.0; } }
  let thin = 1.0 - (1.0 - 1.0 / E.MST) * far;
  return edge * thin;
}`;

// THE ROLLER. Two more grid reads, the same bilinear shape as glassUnwarp, plus a walk along the
// roller's own profile. B.total of zero is the app's guard against a roller that never moved.
WGSL.roller = `
fn rollerAt(cu: f32, cvv: f32) -> vec2<f32> {
  let fx = cu * f32(E.RLnx - 1); let fy = (cvv / E.RLH) * f32(E.RLny - 1);
  var i0 = i32(fx); var j0 = i32(fy);
  if (i0 > E.RLnx - 2) { i0 = E.RLnx - 2; } if (i0 < 0) { i0 = 0; }
  if (j0 > E.RLny - 2) { j0 = E.RLny - 2; } if (j0 < 0) { j0 = 0; }
  let tx = fx - f32(i0); let ty = fy - f32(j0);
  let k = j0 * E.RLnx + i0; let k2 = k + E.RLnx;
  let s = (aBS(k) * (1.0 - tx) + aBS(k + 1) * tx) * (1.0 - ty) + (aBS(k2) * (1.0 - tx) + aBS(k2 + 1) * tx) * ty;
  let v = (aBV(k) * (1.0 - tx) + aBV(k + 1) * tx) * (1.0 - ty) + (aBV(k2) * (1.0 - tx) + aBV(k2 + 1) * tx) * ty;
  return vec2<f32>(s, v);
}
fn rollerHand(s: f32) -> vec2<f32> {
  let n = E.RLn;
  var u = 0.0;
  if (E.RLtotal > 0.0) { u = s / E.RLtotal; }
  let f = clamp(u, 0.0, 1.0) * f32(n - 1);
  var i = i32(f); if (i > n - 2) { i = n - 2; } if (i < 0) { i = 0; }
  let g = f - f32(i);
  return vec2<f32>(aRPR(i) + (aRPR(i + 1) - aRPR(i)) * g, aRTL(i) + (aRTL(i + 1) - aRTL(i)) * g);
}`;


// THE SAME INTEGER SHAPE AS nz, so the same gate: bit-identical or the port is wrong. The app writes
// `| 0` after the multiply AND after the add, which is i32 wraparound; u32 wraps identically and is
// the only wrap WGSL actually defines - signed overflow there is an indeterminate value, not a wrap.
WGSL.woodHash = `
fn woodHash(a: i32, b: i32) -> f32 {
  var h: u32 = u32(a) * 374761393u + u32(b) * 668265263u;
  h = (h ^ (h >> 13u)) * 1274126177u;
  return f32(h ^ (h >> 16u)) / 4294967296.0;
}`;

// THE FORM BLOCK, shared by glassFormT and glassMelt. Scalars only; neither reaches an array.
WGSL.form = `
`;

// FIRST FUNCTION HERE WITH TRANSCENDENTALS IN IT. exp and sin are not IEEE-exact on a GPU and vary by
// vendor inside the allowed ULP budget - section 3 of glass-gpu.md is explicit that this is why the
// GPU path is a different renderer. So this row is expected to sit looser than the pure arithmetic
// ones, and HOW MUCH looser is a thing to measure rather than wave at.
WGSL.glassFormT = `
fn glassFormT(ox: f32, oy: f32, fv: vec2<f32>) -> f32 {
  var T = E.TH;
  if (E.RM > 0.0 && (fv.x != 0.0 || fv.y != 0.0)) {
    let a = ox * fv.x + oy * fv.y;
    let c = -ox * fv.y + oy * fv.x;
    T = T * (1.0 + E.RM * 0.30 * (fbm2(c * E.RS, a * E.RS * 0.06, 71) - 0.5) * 2.0);
  } else if (E.RM > 0.0) {
    T = T * (1.0 + E.RM * 0.18 * (fbm2(ox * E.RS * 0.5, oy * E.RS * 0.5, 11) - 0.5) * 2.0);
  }
  if (E.form == 1) {
    let r = sqrt(ox * ox + oy * oy);
    var k = 1.0;
    if (r < E.FR) { k = r / E.FR; }
    T = T * (1.0 - 0.45 * k);
    let b = r / (E.FR * 0.07);
    T = T + E.TH * 2.0 * exp(-b * b);
    T = T + E.TH * E.RM * 0.14 * sin(r * E.RS * 7.0);
  } else if (E.form == 4) {
    let u = ox * E.FP;
    let f = u - floor(u);
    T = T + E.TH * E.FD * (1.0 - abs(2.0 * f - 1.0));
  }
  return max(T, 0.05);
}`;

// A NINE-CELL WALK with an early a continue in it - the first ported function whose threads can take
// different numbers of iterations. On a CPU that is a branch; in a warp it is divergence, and this is
// a small taste of what glassLay will do at a much larger scale.
WGSL.glassMelt = `
fn glassMelt(ox: f32, oy: f32, fv: vec2<f32>) -> vec2<f32> {
  var o = vec2<f32>(0.0, 0.0);
  if (E.SD <= 0.0 && E.INC <= 0.0) { return o; }
  let flowing = fv.x != 0.0 || fv.y != 0.0;
  var ux = 1.0; var uy = 0.0; var drawn = 1.0;
  if (flowing) { ux = fv.x; uy = fv.y; drawn = E.SST; }
  let a0 = ox * ux + oy * uy;
  let c0 = -ox * uy + oy * ux;
  let cs = 0.06;
  let csa = cs * drawn;
  let gx = i32(floor(c0 / cs));
  let gy = i32(floor(a0 / csa));
  for (var i = -1; i <= 1; i = i + 1) {
    for (var j = -1; j <= 1; j = j + 1) {
      let cx = gx + i;
      let cy = gy + j;
      let h = woodHash(cx, cy + 991);
      let jx = (f32(cx) + 0.5 + (woodHash(cx, cy) - 0.5) * 0.8) * cs;
      let jy = (f32(cy) + 0.5 + (woodHash(cy, cx + 17) - 0.5) * 0.8) * csa;
      let dx = (c0 - jx) / (cs * 0.32);
      let dy = (a0 - jy) / (csa * 0.32);
      let d2 = dx * dx + dy * dy;
      if (d2 < 1.0) {
        let q = 1.0 - d2;
        if (h < E.SD) { o.x = max(o.x, q); }
        else if (h > 1.0 - E.INC) { o.y = max(o.y, q); }
      }
    }
  }
  return o;
}`;


// NO INFINITY IN WGSL, so the sentinel is a number no real p can reach. The app seeds p1 and p2 with
// Infinity and also returns it when sp <= 0; 1e30 stands in for both, and the p1 > 1 test that
// decides "every blob near here ran out first" behaves the same against either.
WGSL.blob = `
fn glassBlobDepth(d: f32, rr: f32) -> f32 {
  let lim = rr * (E.MSQ - 1.0); let rim = rr * 0.16;
  if (d <= -rim) { return 1.0; }
  var far = 1.0;
  if (d <= 0.0) { far = 0.0; } else if (lim > 0.0) { far = d / lim; }
  var edge = 1.0;
  if (d <= 0.0) { if (rim > 0.0) { edge = -d / rim; } else { edge = 1.0; } }
  return edge * (1.0 - (1.0 - 1.0 / E.MST) * far);
}
// TWENTY-FIVE NEIGHBOURS AND A RUNNING BEST TWO. Every thread does the same count of iterations here
// - the app's loop has no a continue - so this one does not diverge; glassLay is where that starts.
fn glassBlob(gc: f32, ga: f32) -> vec4<f32> {
  let s = E.MW; let sq = E.MSQ - 1.0;
  let gx = floor(gc / s); let gy = floor(ga / s);
  var p1 = PINF; var d1 = 0.0; var c1 = -1.0; var b1 = 0.0;
  var p2 = PINF; var d2 = 0.0; var c2 = -1.0; var b2 = 0.0;
  var R = 1;
  if (E.MSQ > 2.0) { R = 2; }
  for (var j = -R; j <= R; j = j + 1) {
    for (var i = -R; i <= R; i = i + 1) {
      let cx = i32(gx) + i; let cy = i32(gy) + j;
      let jx = (f32(cx) + 0.5 + (woodHash(cx, cy) - 0.5) * E.MJ) * s;
      let jy = (f32(cy) + 0.5 + (woodHash(cy, cx + 31) - 0.5) * E.MJ) * s;
      let rr = s * 0.5 * (0.62 + 0.3 * woodHash(cx + 5, cy + 11));
      let dx = gc - jx; let dy = ga - jy;
      let d = sqrt(dx * dx + dy * dy) - rr;
      let sp = rr * sq;
      var pp = PINF;
      if (d <= 0.0) { pp = d; } else if (sp > 0.0) { pp = d / sp; }
      let col = f32(i32(floor(woodHash(cx + 101, cy + 211) * E.CN)) % i32(E.CN));
      if (pp < p1) { p2 = p1; d2 = d1; c2 = c1; b2 = b1; p1 = pp; d1 = d; c1 = col; b1 = rr; }
      else if (pp < p2) { p2 = pp; d2 = d; c2 = col; b2 = rr; }
    }
  }
  var o = vec4<f32>(-1.0, -1.0, 0.0, 0.0);
  if (c1 < 0.0 || p1 > 1.0) { return o; }
  o.x = c1; o.w = glassBlobDepth(d1, b1);

// slowest path any of them takes. This is the first ported function where the SHAPE of the control
// flow, not its arithmetic, is what the measurement is about.

@group(0) @binding(1) var<storage, read_write> OUT: array<f32>;
@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) g: vec3<u32>) {

  const keep = [];

    dev.queue.writeBuffer(b, 0, data); keep.push(b); return b;

  const read = dev.createBuffer({ size: N * OW * 4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  const entries = [{ binding: 0, resource: { buffer: inBuf } }, { binding: 1, resource: { buffer: outBuf } }];
  if (uni) {
    const b = dev.createBuffer({ size: Math.max(16, uni.byteLength), usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    dev.queue.writeBuffer(b, 0, uni); keep.push(b);

    resource: { buffer: sbuf(a, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST) } }));

  // the pipeline layout does not throw, it just leaves the output buffer untouched - and an untouched
  // buffer reads as zeros, which is a plausible-looking answer. That is exactly how an S23 reported
  // out[0] = 0.00 for a whole tile earlier today, and this harness reproduced it within the hour: with
  // layout: 'auto' a binding the entry point never reaches is ELIMINATED, so passing it is invalid
  // and every row came back 1.0 relative with nothing said. Scope it, and a silent zero becomes a
  // sentence.

  const out = new Float32Array(read.getMappedRange().slice(0));
  read.unmap();
  return out;
}

          o[2 * i] = t[0]; o[2 * i + 1] = t[1]; } return o; } },

    { name: 'woodHash', kind: 'EXACT', needs: ['woodHash'],
      call: '  OUT[i * 2] = woodHash(i32(IN[i * 2]), i32(IN[i * 2 + 1])); OUT[i * 2 + 1] = 0.0;',
      inputs: () => { const a = new Float32Array(N * 2);
        for (let i = 0; i < N; i++) { a[2 * i] = (i % 211) - 105; a[2 * i + 1] = ((i * 13) % 199) - 99; } return a; },
      cpu: a => { const o = new Float64Array(N * 2);
        for (let i = 0; i < N; i++) o[2 * i] = app.woodHash(a[2 * i], a[2 * i + 1]); return o; } },

    { name: 'glassFormT', kind: 'f32', needs: ['env', 'nz', 'vnoise', 'fbm2', 'glassFormT'],
      uni: () => envUni({ form: CURFORM }), arrays: allArrays, perForm: true, gpuTranscendental: true,
      call: TOUCH_ALL + '  let fv = vec2<f32>(IN[i * 4 + 2], IN[i * 4 + 3]);\n'
          + '  OUT[i * 2] = glassFormT(IN[i * 4], IN[i * 4 + 1], fv); OUT[i * 2 + 1] = 0.0;',
      inputs: () => { const a = new Float32Array(N * 4);
        for (let i = 0; i < N; i++) { a[4 * i] = Math.fround((i % 181) * 0.031 - 2.8);
          a[4 * i + 1] = Math.fround(((i * 7) % 167) * 0.024 - 2.0);
          a[4 * i + 2] = Math.fround(Math.cos(i * 0.013));
          a[4 * i + 3] = Math.fround(Math.sin(i * 0.013)); } return a; },
      cpu: (a, form) => { const o = new Float64Array(N * 2);
        const F = { TH: FV.TH, RM: FV.RM, RS: FV.RS, FR: FV.FR, FP: FV.FP, FD: FV.FD, form };
        for (let i = 0; i < N; i++) o[2 * i] = app.glassFormT(a[4 * i], a[4 * i + 1], F, [a[4 * i + 2], a[4 * i + 3]]);
        return o; } },

    { name: 'glassMelt', kind: 'f32', needs: ['env', 'woodHash', 'glassMelt'],
      uni: () => envUni({ form: CURFORM }), arrays: allArrays, perForm: true,
      // divides by cs * 0.32 = 0.0192 and squares, so f32 epsilon arrives about 2,700x larger. The
      // outputs are bounded to [0,1], so the figure is absolute: 2e-5 is 0.005 levels of 255.
      gate: 2e-5, gateWhy: 'amplifies f32 epsilon ~2700x; 2e-5 is 0.005 levels',
      call: TOUCH_ALL + '  let fv = vec2<f32>(IN[i * 4 + 2], IN[i * 4 + 3]);\n'
          + '  let m = glassMelt(IN[i * 4], IN[i * 4 + 1], fv);\n'
          + '  OUT[i * 2] = m.x; OUT[i * 2 + 1] = m.y;',
      inputs: () => { const a = new Float32Array(N * 4);
        for (let i = 0; i < N; i++) { a[4 * i] = Math.fround((i % 157) * 0.017 - 1.3);
          a[4 * i + 1] = Math.fround(((i * 11) % 149) * 0.015 - 1.1);
          a[4 * i + 2] = Math.fround(Math.cos(i * 0.013));
          a[4 * i + 3] = Math.fround(Math.sin(i * 0.013)); } return a; },
      cpu: (a, form) => { const o = new Float64Array(N * 2), t = [0, 0];
        const F = { SD: FV.SD, INC: FV.INC, SST: FV.SST };
        for (let i = 0; i < N; i++) {
          app.glassMelt(a[4 * i], a[4 * i + 1], F, [a[4 * i + 2], a[4 * i + 3]], t);
          o[2 * i] = t[0]; o[2 * i + 1] = t[1];
        } return o; } },

    { name: 'glassBlob', kind: 'f32', needs: ['env', 'woodHash', 'blob'], outs: 4,
      // channels 0 and 1 are the two cane INDICES - section 3's dangerous class, where being close is
      // being wrong - and 2 and 3 are their depths, which only shade. Gated accordingly.
      channelKinds: ['EXACT', 'EXACT', 'custom', 'custom'], gate: 1e-5,
      gateWhy: 'indices bit-exact; depths within 1e-5 (0.003 levels)',
      uni: () => envUni(), arrays: allArrays,
      call: TOUCH_ALL + '  let b = glassBlob(IN[i * 2], IN[i * 2 + 1]);\n'
          + '  OUT[i * 4] = b.x; OUT[i * 4 + 1] = b.y; OUT[i * 4 + 2] = b.z; OUT[i * 4 + 3] = b.w;',
      inputs: () => { const a = new Float32Array(N * 2);
        for (let i = 0; i < N; i++) { a[2 * i] = Math.fround((i % 173) * 0.037 - 3.2);
          a[2 * i + 1] = Math.fround(((i * 9) % 163) * 0.029 - 2.4); } return a; },
      cpu: a => { const o = new Float64Array(N * 4), t = [0, 0, 0, 0];
        const F = { MW: BLV.MW, MSQ: BLV.MSQ, MJ: BLV.MJ, CN: BLV.CN, MST: BLV.MST };
        for (let i = 0; i < N; i++) { app.glassBlob(a[2 * i], a[2 * i + 1], F, t);
          o[4 * i] = t[0]; o[4 * i + 1] = t[1]; o[4 * i + 2] = t[2]; o[4 * i + 3] = t[3]; } return o; } },

    { name: 'rollStampAt', kind: 'f32', needs: ['env', 'stamp'], gpuTranscendental: true,
      uni: () => envUni(), arrays: allArrays,
      call: TOUCH_ALL + '  OUT[i * 2] = rollStampAt(IN[i * 2], IN[i * 2 + 1]); OUT[i * 2 + 1] = 0.0;',
      // s sweeps several circumferences so the modulo wraps; v spans past the stamps both ways
      inputs: () => { const a = new Float32Array(N * 2);
        for (let i = 0; i < N; i++) { a[2 * i] = Math.fround((i / N) * 5.3 - 1.1);
          a[2 * i + 1] = Math.fround(((i * 23) % 211) / 210 * 1.4 - 0.7); } return a; },
      cpu: a => { const o = new Float64Array(N * 2);
        const op = { st: STD.list, D: STD.D };
        for (let i = 0; i < N; i++) o[2 * i] = app.rollStampAt(a[2 * i], a[2 * i + 1], op); return o; } },

    // THREE ROWS FOR ONE FUNCTION, because glassLay has three bodies and a pixel takes whichever its
    // slab asks for. Testing only the one this slab uses would leave the other two unported and
    // unnoticed until somebody changed a mould.
    { name: 'glassLay strips', kind: 'f32', needs: ['env', 'nz', 'vnoise', 'fbm2', 'woodHash', 'woodAtan2', 'ribbon', 'blob', 'glassLay'], outs: 4,
      channelKinds: ['EXACT', 'EXACT', 'custom', 'custom'], gate: 1e-5,
      gateWhy: 'cane indices bit-exact; depths within 1e-5',
      uni: () => envUni({ MCn: 0 }), arrays: allArrays,
      call: TOUCH_ALL + '  let L = glassLay(IN[i * 2], IN[i * 2 + 1]);' + NLC
          + '  OUT[i * 4] = L.x; OUT[i * 4 + 1] = L.y; OUT[i * 4 + 2] = L.z; OUT[i * 4 + 3] = L.w;',
      inputs: () => { const a = new Float32Array(N * 2);
        for (let i = 0; i < N; i++) { a[2 * i] = Math.fround((i % 191) * 0.027 - 2.5);
          a[2 * i + 1] = Math.fround(((i * 7) % 179) * 0.021 - 1.8); } return a; },
      cpu: a => { const o = new Float64Array(N * 4), v = [0, 0, 0, 0];
        const F = { MR: false, MB: false, MC: null, TW: 0.21, LC: 0.83, LS: 0.42, CW: 0.6,
                    RS: FV.RS, CS: 1.7, CN: BLV.CN, LP: 0.18 };
        for (let i = 0; i < N; i++) { app.glassLay(a[2 * i], a[2 * i + 1], F, v);
          for (let k = 0; k < 4; k++) o[4 * i + k] = v[k]; } return o; } },

    { name: 'glassLay cells', kind: 'f32', needs: ['env', 'nz', 'vnoise', 'fbm2', 'woodHash', 'woodAtan2', 'ribbon', 'blob', 'glassLay'], outs: 4,
      channelKinds: ['EXACT', 'EXACT', 'custom', 'custom'], gate: 1e-5,
      gateWhy: 'the divergent path - a skip inside a per-ribbon loop',
      uni: () => envUni({ MCn: NRIB }), arrays: allArrays,
      call: TOUCH_ALL + '  let L = glassLay(IN[i * 2], IN[i * 2 + 1]);' + NLC
          + '  OUT[i * 4] = L.x; OUT[i * 4 + 1] = L.y; OUT[i * 4 + 2] = L.z; OUT[i * 4 + 3] = L.w;',
      inputs: () => { const a = new Float32Array(N * 2);
        for (let i = 0; i < N; i++) { a[2 * i] = Math.fround((i % 149) * 0.021 - 1.6);
          a[2 * i + 1] = Math.fround(((i * 11) % 137) * 0.009 - 0.6); } return a; },
      cpu: a => { const o = new Float64Array(N * 4), v = [0, 0, 0, 0];
        const F = { MR: false, MB: false, MC: MCC_COL.map(c => ({ c })), MD: RIBD.md, MRIM: RIBD.rim,
                    MEX: RIBD.ex, MHL: RIBD.hl, MOB, MST };
        for (let i = 0; i < N; i++) { app.glassLay(a[2 * i], a[2 * i + 1], F, v);
          for (let k = 0; k < 4; k++) o[4 * i + k] = v[k]; } return o; } },

    { name: 'glassLay blob + radial', kind: 'f32', needs: ['env', 'nz', 'vnoise', 'fbm2', 'woodHash', 'woodAtan2', 'ribbon', 'blob', 'glassLay'], outs: 4,
      channelKinds: ['EXACT', 'EXACT', 'custom', 'custom'], gate: 1e-5,
      // TWO AMPLIFIERS IN SERIES. woodAtan2's f32 error is multiplied by (0.5 + r) - the same
      // amplification measured on the CPU this morning, 1.51e-3 rad becoming 76 px at the rim -
      // and the displaced coordinate then runs through glassBlob's d / sp. 2.5e-5 on a depth in
      // [0,1] is 0.006 levels. The INDICES remain bit-exact, which is the part section 3 cares
      // about: the cane chosen is the same cane.
      gate: 5e-5,
      gateWhy: 'radial pre-transform compounds woodAtan2 then glassBlob; 5e-5 is 0.013 levels',
      uni: () => envUni({ MB: true, MR: true }), arrays: allArrays,
      call: TOUCH_ALL + '  let L = glassLay(IN[i * 2], IN[i * 2 + 1]);' + NLC
          + '  OUT[i * 4] = L.x; OUT[i * 4 + 1] = L.y; OUT[i * 4 + 2] = L.z; OUT[i * 4 + 3] = L.w;',
      inputs: () => { const a = new Float32Array(N * 2);
        for (let i = 0; i < N; i++) { a[2 * i] = Math.fround((i % 173) * 0.037 - 3.2);
          a[2 * i + 1] = Math.fround(((i * 9) % 163) * 0.029 - 2.4); } return a; },
      cpu: a => { const o = new Float64Array(N * 4), v = [0, 0, 0, 0];
        const F = { MR: true, MB: true, MW: BLV.MW, MSQ: BLV.MSQ, MJ: BLV.MJ, CN: BLV.CN, MST };
        for (let i = 0; i < N; i++) { app.glassLay(a[2 * i], a[2 * i + 1], F, v);
          for (let k = 0; k < 4; k++) o[4 * i + k] = v[k]; } return o; } },
  ];
}

// Keeps every declared binding reachable - see the note at the ribbon and roller cases.
let CURFORM = 'rolled';

// GPU exp and sin are not IEEE-exact and vary by vendor inside the ULP budget, so a function
// carrying them gets its own gate. Loosening the shared one instead would quietly excuse every
// other row as well, which is how a gate stops meaning anything.
const GATE = { EXACT: 0, f32: 2e-6, branch: 0, trig: 5e-5, custom: 0 };

document.getElementById('run').onclick = async () => {
  document.getElementById('run').disabled = true;
  RES.textContent = ''; TB = null; LOG.textContent = '';
  try {
    const { app, from } = await liftFromApp(['nz', 'woodAtan2', 'glassFlow', 'glassUnwarp', 'vnoise', 'vnoiseC', 'vnoiseCfill',
      'fbm2C', 'glassCellSDF', 'glassDepth', 'rollerAt', 'rollerHand', 'woodHash', 'glassFormT',
      'glassMelt', 'glassBlob', 'glassBlobDepth', 'rollStampAt', 'starR', 'glassLay']);
    if (!navigator.gpu) throw new Error('no WebGPU on this device');
    const ad = await navigator.gpu.requestAdapter();
    if (!ad) throw new Error('no adapter');
    const dev = await ad.requestDevice();

    table(['function', 'what counts as right', 'worst', 'gate', 'notes']);
    let bad = 0, done = 0;
    for (const c of cases(app)) {
      const forms = c.perForm ? Object.keys(FORM) : [null];
      // PER FORM, RESET EACH TIME. The first version carried `worst` across the whole loop, so one
      // computing arm marked every form as failing and the note read "spun! poured! blown!" when only
      // spun had anything to answer for.
      let worst = 0, note = [], anyBad = false, overCount = 0; const chBad = [];
      for (const form of forms) {
        let fWorst = 0;
        const inp = c.inputs();
        const bodies = {};
        for (const n of c.needs) bodies[n] = WGSL[n];
        let call = c.call;
        if (form) { CURFORM = form; call = call.replace('FORMSEL', String(FORM[form])); }
        let got;
        try { got = await runWgsl(dev, bodies, call, N, inp, c.uni ? c.uni() : null, c.arrays ? c.arrays() : null, c.outs); }
        catch (e) { row([c.name, c.kind, '—', '—', 'DID NOT COMPILE: ' + e.message], 'bad'); bad++; worst = NaN; break; }
        const want = form ? c.cpu(inp, form) : c.cpu(inp);
        let kind = (form && c.kindPerForm && c.kindPerForm[form]) || c.kind;
        if (c.gpuTranscendental && kind === 'f32') kind = 'trig';
        if (c.gate) { GATE.custom = c.gate; kind = 'custom'; }
        for (let i = 0; i < N * (c.outs || 2); i++) {
          const w = want[i], g = got[i];
          const ck = c.channelKinds ? c.channelKinds[i % (c.outs || 2)] : kind;
          const d = ck === 'EXACT' ? (Math.fround(w) === g ? 0 : 1)
                  : Math.abs(w - g) / Math.max(1, Math.abs(w));
          if (d > GATE[ck]) chBad[i % (c.outs || 2)] = (chBad[i % (c.outs || 2)] || 0) + 1;
          if (d > fWorst) fWorst = d;
        }
        const fOk = c.channelKinds ? !chBad.some(v => v > 0) : fWorst <= GATE[kind];
        if (!fOk) { let over = 0;
          for (let i = 0; i < N * (c.outs || 2); i++) {
            const w = want[i], g = got[i];
            const d = kind === 'EXACT' ? (Math.fround(w) === g ? 0 : 1)
                    : Math.abs(w - g) / Math.max(1, Math.abs(w));
            if (d > GATE[kind]) over++;
          }
          overCount = Math.max(overCount, over); }
        if (!fOk) anyBad = true;
        if (fWorst > worst) worst = fWorst;
        if (form) note.push(form + ':' + (kind === 'f32' ? fWorst.toExponential(0) : fOk ? 'exact' : 'DIFFERS'));
      }
      if (Number.isNaN(worst)) continue;
      done++;
      // ONE VERDICT, THE ONE ALREADY COMPUTED. This re-tested the worst against the case's generic
      // kind, so a row that passed its own per-channel or per-case gate failed here anyway -
      // glassBlob cleared four channel gates and was then marked not-ready against a 2e-6 it was
      // never held to. anyBad carries the real per-arm answer; nothing else should second-guess it.
      const ok = !anyBad;
      if (!ok) bad++;
      row([c.name, c.gateWhy ? c.gateWhy : c.kind === 'EXACT' ? 'bit-identical'
            : c.kind === 'branch' ? 'exact where it selects, 2e-6 where it computes'
            : 'within 2e-6 relative',
        c.kind === 'EXACT' ? (worst ? 'DIFFERS' : 'identical') : worst.toExponential(1),
        c.gate ? c.gate.toExponential(0) : c.perForm ? 'per arm'
          : c.gpuTranscendental ? '5e-5' : c.kind === 'f32' ? '2e-6' : '0',
        (c.channelKinds ? c.channelKinds.map((k, n) => 'ch' + n + ':' + k + (chBad[n] ? ' ' + chBad[n] + ' BAD' : ' ok')).join('  ') : '')
          + (note.length ? 'forms: ' + note.join(' ') : '')
          + (overCount ? '   ' + overCount + ' of ' + (N * (c.outs || 2)) + ' past the gate'
              + (overCount < 8 ? ' — discrete, not rounding' : '') : '')], ok ? 'good' : 'bad');
      log(c.name + ': worst ' + worst);
    }

    const v = document.createElement('p');
    v.className = 'verdict ' + (bad ? 'bad' : 'good');
    v.textContent = bad ? bad + ' of ' + done + ' not ready for the shader'
      : done + ' of ' + done + ' agree with the app — these may join the shader';
    RES.appendChild(v);
    TB = null;
    const p = document.createElement('p');
    p.style.color = 'var(--dim)';
    p.textContent = 'Seventeen rows, fifteen functions — about 206 of the 282 lines, and all '
      + 'three of glassLay’s paths. Still to port: the op chain (55), which walks the slab’s '
      + 'ops backwards per pixel and is the last piece before a whole tile can be drawn.';
    RES.appendChild(p);
  } catch (e) {
    const v = document.createElement('p');
    v.className = 'verdict bad'; v.textContent = 'failed: ' + (e && e.message || e);
    RES.appendChild(v);
    log(String(e && e.stack || e));
  } finally {
    document.getElementById('run').disabled = false;
  }
};
</script>
