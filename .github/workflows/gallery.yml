name: gallery determinism

# Renders every gallery hero from its slab (gallery/reference.json) inside a pinned Playwright/Chromium
# container and checks two things:
#   - SELF-DETERMINISM (hard gate): each hero renders byte-identical twice from a fresh load — the render is a
#     pure function of the slab in this environment.
#   - REFERENCE MATCH (reported): whether this container's raw-pixel hash equals the committed pixelSHA256, which
#     was captured in a different browser build. A cross-build DIFF is expected-and-informative, not a failure,
#     until the reference is blessed from this environment (then add --strict to gate on it).

on:
  push:
    branches: [master]
    paths:
      - 'app/stone-author.html'
      - 'gallery/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gallery.yml'
  pull_request:
    paths:
      - 'app/stone-author.html'
      - 'gallery/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (browsers are pre-installed in the container)
        run: npm ci
      - name: Build the hooked page
        run: node harness/inject.mjs
      - name: Render + check determinism
        run: node harness/render.mjs
