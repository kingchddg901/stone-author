name: browser harness

# The three gates that need a real browser, in one pinned Playwright/Chromium container.
#
# GALLERY SELF-DETERMINISM — renders every hero from its slab (gallery/reference.json) twice from a fresh
# load and requires byte-identical pixels, so the render is a pure function of the slab in this
# environment. A cross-build REFERENCE match against the committed pixelSHA256 is deliberately NOT gated:
# sub-pixel canvas AA varies between Chromium builds, so the picture is identical but the bytes are not
# (that comparison was dropped from harness/render.mjs).
#
# EXPORT PROGRESS — runs a small export and requires the status line to keep changing and the button to
# be held disabled. Added after a big export was found to report itself only through a hint that removes
# itself after 2.6 s, leaving minutes of work looking like a hung page.
#
# THREE ENGINES — renders the richest hero at 1024 in Blink, Gecko and WebKit, measures each engine's real
# canvas limits and band shapes, streams a multi-band PNG, and reports the difference from Blink as an 8x8
# map. Safari cannot be tested from a PC and every browser on iOS is WebKit underneath, so WebKit was the
# one engine the studio shipped to blind.
#
# PEN CALIBRATION — hands the calibrator a synthetic pen of known rate, pressure, tilt and speed and
# requires it to report those numbers back. Added after the calibrator measured a 480 Hz pen as 3333 Hz,
# which no test could see because nothing here had ever been given a pen whose answers were known.

on:
  push:
    branches: [master]
    paths:
      - 'app/stone-author.html'
      - 'gallery/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gallery.yml'
  pull_request:
    paths:
      - 'app/stone-author.html'
      - 'gallery/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30            # three engines; a hung phase must not sit on a runner
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (browsers are pre-installed in the container)
        run: npm ci
      - name: Build the hooked page
        run: node harness/inject.mjs
      - name: Render + check determinism
        run: node harness/render.mjs
      - name: Calibrate a synthetic pen and check the studio recovers it
        run: node harness/calibration.mjs
      - name: Check an export says it is working for as long as it works
        run: node harness/export-progress.mjs
      - name: Render the same hero in Blink, Gecko and WebKit
        timeout-minutes: 22        # the script bounds each phase; this bounds the script
        run: node harness/engines.mjs
      # kept even when the step above fails: a red engine run is exactly when the picture is wanted
      - name: Keep each engine's 1024 render and its x8 difference image
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-renders
          path: harness/dist/engines/
          retention-days: 14
          if-no-files-found: warn
