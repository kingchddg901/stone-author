name: gallery determinism

# Renders every gallery hero from its slab (gallery/reference.json) inside a pinned Playwright/Chromium
# container and gates on SELF-DETERMINISM: each hero renders byte-identical twice from a fresh load, so the
# render is a pure function of the slab in this environment. A cross-build REFERENCE match against the
# committed pixelSHA256 is deliberately NOT gated — sub-pixel canvas AA varies between Chromium builds, so
# the picture is identical but the bytes are not (that comparison was dropped from harness/render.mjs).

on:
  push:
    branches: [master]
    paths:
      - 'app/stone-author.html'
      - 'gallery/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/gallery.yml'
  pull_request:
    paths:
      - 'app/stone-author.html'
      - 'gallery/**'
      - 'harness/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.48.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (browsers are pre-installed in the container)
        run: npm ci
      - name: Build the hooked page
        run: node harness/inject.mjs
      - name: Render + check determinism
        run: node harness/render.mjs
