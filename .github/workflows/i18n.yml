name: i18n

# Guards the four ways a translated UI rots silently: a user-facing string that never got a key, a key the
# studio asks for that no pack defines, a translation pack that has drifted from English, and a translation
# whose placeholders differ from the English (which drops the value at runtime without throwing).
# No browser needed — this reads the app and the packs as text.

on:
  push:
    branches: [master]
    paths:
      - 'app/stone-author.html'
      - 'i18n/**'
      # EVERYTHING IN tools/, not a list of names. The list was of check-* files only, so the six
      # probes wired into this workflow on 2026-10-16 ran when the APP changed and never when the
      # PROBE did - a gate can be edited into uselessness and nothing would have run it. A name that
      # has to be added by hand is a name somebody forgets; the extra CI minutes on an unrelated
      # script are cheaper than a silent gap.
      - 'tools/**'
      - 'docs/functions.md'
      - '.github/workflows/i18n.yml'
  pull_request:
    paths:
      - 'app/stone-author.html'
      - 'i18n/**'
      # EVERYTHING IN tools/, not a list of names. The list was of check-* files only, so the six
      # probes wired into this workflow on 2026-10-16 ran when the APP changed and never when the
      # PROBE did - a gate can be edited into uselessness and nothing would have run it. A name that
      # has to be added by hand is a name somebody forgets; the extra CI minutes on an unrelated
      # script are cheaper than a silent gap.
      - 'tools/**'
      - 'docs/functions.md'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # check-build.mjs compares this commit against the one before it
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every user-facing string is routed and every pack matches English
        run: node tools/check-i18n.mjs
      - name: The build marker must move when the app does
        run: node tools/check-build.mjs
      - name: Nothing that scales the coat may measure the window
        run: node tools/check-render-purity.mjs
      - name: Every export path takes and drops the screen wake lock
        run: node tools/check-wake-lock.mjs
      - name: The device identity is sealed under the slab, and fails closed
        run: node tools/check-device-seal.mjs
      - name: A crossfade never evaluates the light between its two ends
        run: node tools/check-crossfade.mjs
      - name: Every panel token names something real, inside its own bounds, with a string in the pack
        run: node tools/check-panel-tokens.mjs
      - name: The render signature moves on the picture and the light, and holds on bookkeeping
        run: node tools/ablate-state-sig.mjs
      - name: Every blur a tile can meet has bleed behind it, and the bloom is probed
        run: node tools/check-bleed.mjs
      - name: PNG metadata
        run: node tools/check-png-meta.mjs
      - name: A master's own record is found however far back it sits
        run: node tools/check-meta-window.mjs
      - name: Every line pin in the function reference lands on its function
        run: node tools/check-fn-refs.mjs
      - name: The material fork happens in one place or it is not a fork
        run: node tools/check-material-fork.mjs
      - name: Nothing is called from outside the function that declares it
        run: node tools/check-scope.mjs
      - name: The worker core carries every name it reaches for
        run: node tools/check-worker-core.mjs
      - name: A tile carries its address, and a moved one is caught
        run: node tools/probe-mark.mjs
      - name: The overview reducer is a pure function of the picture
        run: node tools/probe-reduce.mjs
      - name: The mark's entry gate is wide enough for the one field that defeats the read
        run: node tools/probe-gate.mjs
      - name: The export clock measures the render, not the person reading the dialog
        run: node tools/check-export-clock.mjs
      - name: The carry check measures only for glass, only when idle, only once the hand stops
        run: node tools/check-carry.mjs
      - name: An op without a centre is the op it always was, bit for bit
        run: node tools/check-op-origin.mjs
      - name: Two masters of one picture are the same picture, and a marked one says so
        run: node tools/check-same-image.mjs --selftest
      - name: The directory lands after the tile data, whatever order the tiles arrived in
        run: node tools/probe-tiff-offsets.mjs
      - name: The writer worker carries every name it reaches for
        run: node tools/check-writer-worker.mjs
      - name: A killed render picks up where it stopped, or refuses to
        run: node tools/probe-resume.mjs
      - name: Tiles assemble into the picture they were cut from
        run: node tools/probe-assembly.mjs
      - name: The pool sheds workers under pressure and never below its floor
        run: node tools/probe-pool-strain.mjs
      - name: The pool picks a width the device can actually carry
        run: node tools/probe-pool-width.mjs
      - name: The four render stamps sit on the right side of their flags
        run: node tools/check-pool-trace.mjs
      - name: A saturated pool and a starved one are told apart, from one completion log
        run: node tools/probe-pool-trace.mjs
