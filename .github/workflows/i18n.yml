name: i18n

# Guards the four ways a translated UI rots silently: a user-facing string that never got a key, a key the
# studio asks for that no pack defines, a translation pack that has drifted from English, and a translation
# whose placeholders differ from the English (which drops the value at runtime without throwing).
# No browser needed — this reads the app and the packs as text.

on:
  push:
    branches: [master]
    paths:
      - 'app/stone-author.html'
      - 'i18n/**'
      # EVERYTHING IN tools/, not a list of names. The list was of check-* files only, so the six
      # probes wired into this workflow on 2026-10-16 ran when the APP changed and never when the
      # PROBE did - a gate can be edited into uselessness and nothing would have run it. A name that
      # has to be added by hand is a name somebody forgets; the extra CI minutes on an unrelated
      # script are cheaper than a silent gap.
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/i18n.yml'
  pull_request:
    paths:
      - 'app/stone-author.html'
      - 'i18n/**'
      # EVERYTHING IN tools/, not a list of names. The list was of check-* files only, so the six
      # probes wired into this workflow on 2026-10-16 ran when the APP changed and never when the
      # PROBE did - a gate can be edited into uselessness and nothing would have run it. A name that
      # has to be added by hand is a name somebody forgets; the extra CI minutes on an unrelated
      # script are cheaper than a silent gap.
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/i18n.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2      # check-build.mjs compares this commit against the one before it
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check every user-facing string is routed and every pack matches English
        run: node tools/check-i18n.mjs
      - name: The build marker must move when the app does
        run: node tools/check-build.mjs
      - name: Nothing that scales the coat may measure the window
        run: node tools/check-render-purity.mjs
      - name: Every export path takes and drops the screen wake lock
        run: node tools/check-wake-lock.mjs
      - name: The device identity is sealed under the slab, and fails closed
        run: node tools/check-device-seal.mjs
      - name: A crossfade never evaluates the light between its two ends
        run: node tools/check-crossfade.mjs
      - name: Every panel token names something real, inside its own bounds, with a string in the pack
        run: node tools/check-panel-tokens.mjs
      - name: The render signature moves on the picture and the light, and holds on bookkeeping
        run: node tools/ablate-state-sig.mjs
      - name: Every blur a tile can meet has bleed behind it, and the bloom is probed
        run: node tools/check-bleed.mjs
      - name: PNG metadata
        run: node tools/check-png-meta.mjs
      - name: A master's own record is found however far back it sits
        run: node tools/check-meta-window.mjs
      - name: Every line pin in the function reference lands on its function
        run: node tools/check-fn-refs.mjs
      - name: The app’s shader matches tools/lib
        run: node tools/check-gpu-sync.mjs
      - name: The GPU’s finishers are actually reached
        run: node tools/check-gpu-finish.mjs
      - name: A faulted GPU stops writing tiles
        run: node tools/check-gpu-fault.mjs
      - name: The material fork happens in one place or it is not a fork
        run: node tools/check-material-fork.mjs
      - name: Nothing is called from outside the function that declares it
        run: node tools/check-scope.mjs
      - name: Every relative link in the docs points at a file
        run: node tools/check-doc-links.mjs
      - name: The sidecar README still describes the sidecar folder
        run: node tools/check-sidecar-totals.mjs
      - name: The worker core carries every name it reaches for
        run: node tools/check-worker-core.mjs
      - name: A tile carries its address, and a moved one is caught
        run: node tools/probe-mark.mjs
      - name: The overview reducer is a pure function of the picture
        run: node tools/probe-reduce.mjs
      - name: Tiles built in parallel are written in the order their offsets claim
        run: node tools/probe-pyramid-order.mjs
      - name: The harvester can see the masters this app actually writes
        run: node tools/check-harvest-names.mjs
      - name: A document the GPU arena cannot hold is refused, and the refusal is recorded
        run: node tools/check-gpu-refusal.mjs
      - name: A tree flattens into an arena without losing a field
        run: node tools/check-wood-pack.mjs
      - name: Every array the wood shader indexes is packed as one
        run: node tools/check-wood-inputs.mjs
      - name: The probe pages still parse
        run: node tools/check-probe-pages.mjs
      - name: The ported wood blocks carry the app's own constants
        run: node tools/check-wood-shader.mjs
      - name: The mark's entry gate is wide enough for the one field that defeats the read
        run: node tools/probe-gate.mjs
      - name: The export clock measures the render, not the person reading the dialog
        run: node tools/check-export-clock.mjs
      - name: The carry check measures only for glass, only when idle, only once the hand stops
        run: node tools/check-carry.mjs
      - name: An op without a centre is the op it always was, bit for bit
        run: node tools/check-op-origin.mjs
      - name: Two masters of one picture are the same picture, and a marked one says so
        run: node tools/check-same-image.mjs --selftest
      - name: The directory lands after the tile data, whatever order the tiles arrived in
        run: node tools/probe-tiff-offsets.mjs
      - name: The writer worker carries every name it reaches for
        run: node tools/check-writer-worker.mjs
      - name: A killed render picks up where it stopped, or refuses to
        run: node tools/probe-resume.mjs
      - name: Tiles assemble into the picture they were cut from
        run: node tools/probe-assembly.mjs
      - name: The pool sheds workers under pressure and never below its floor
        run: node tools/probe-pool-strain.mjs
      - name: The pool picks a width the device can actually carry
        run: node tools/probe-pool-width.mjs
      - name: The four render stamps sit on the right side of their flags
        run: node tools/check-pool-trace.mjs
      - name: A saturated pool and a starved one are told apart, from one completion log
        run: node tools/probe-pool-trace.mjs

      # PROBES THAT HAD NEVER BEEN RUN BY CI. Fourteen of them, four of which did not run at all:
      # the glass probes still built F with OPS and the walk has read the COMPILED F.OPC for some
      # time, and two of them had not been taught the corner cache or the spin table either. Each
      # was ablated against the app before being listed here - a probe nobody has seen go red is a
      # preference, and probe-glass-stir was exactly that: it computed seven checks, printed them,
      # and exited 0 whatever they said.
      - name: The canvas probe takes a budget and consults it between surfaces
        run: node tools/check-probe-budget.mjs
      - name: The unrolled op chain agrees with the walk it was sliced from, or falls back
        run: node tools/probe-chain-spec.mjs
      - name: The corner cache returns exactly what the uncached hash would
        run: node tools/probe-hash-cache.mjs
      - name: A spin is the rotation it claims to be, within the table's own bound
        run: node tools/probe-spin-identity.mjs
      - name: The analytic gradient matches the field it is a gradient of
        run: node tools/probe-glass-gradient.mjs
      - name: Ribbons laid in a mould reach every colour, and a mould is not a warp
        run: node tools/probe-glass-lay.mjs
      - name: A pressed ribbon spends a budget of material, not of size
        run: node tools/probe-glass-press.mjs
      - name: Blobs scatter, and a roller leaves stamps where it touched down
        run: node tools/probe-glass-blobs.mjs
      - name: A stir moves the lay-up and a finite ball stays inside its radius
        run: node tools/probe-glass-stir.mjs
      - name: The roller's phase is pinned to the pass, not to the origin
        run: node tools/probe-glass-roller.mjs
      - name: A chevron reads as one direction, not two
        run: node tools/probe-chevron.mjs
      - name: A cut section exposes the material it was cut from
        run: node tools/probe-cut-section.mjs
      - name: A rosette closes on itself
        run: node tools/probe-rosette.mjs
      - name: The calibrator reports back the pen it was handed
        run: node tools/probe-pen-calibration.mjs
      - name: The spin table holds its accuracy whatever the spin, which indexing by radius would not
        run: node tools/probe-spin-table-ab.mjs
      # A GATE THAT IS NOT NAMED HERE DOES NOT GATE ANYTHING. `tools/**` above is the TRIGGER - it
      # decides when this workflow runs, not what it runs - and the four below were written, run by
      # hand, and left out of this list, so they passed locally and could not have stopped a push.
      # Two of them were written the same day as the defects they catch.
      - name: Only a render the planner chose may write the remembered tile
        run: node tools/check-plan-memory.mjs
      - name: The studio asks once whether the GPU drew this frame
        run: node tools/check-preview-face.mjs
      - name: A master that painted one flat colour is kept, not recorded as good and deleted
        run: node tools/check-harvest-aside.mjs
      - name: An offset a material does not declare is never written, because undefined means byte zero
        run: node tools/check-gpu-uniform-patch.mjs
